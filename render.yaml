services:
  - type: web
    name: llm-response-eval-framework
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-pro-preview
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
