<svg width="680" height="770" viewBox="0 0 680 770" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>LLM Response Evaluation Framework - System Architecture</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="770" fill="#ffffff"/>

<!-- 1. Submission form -->
<rect x="190" y="30" width="300" height="44" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.75"/>
<text x="340" y="57" text-anchor="middle" font-size="14" font-weight="600" fill="#2c2c2a">Evaluation submission form</text>
<line x1="340" y1="74" x2="340" y2="104" stroke="#5f5e5a" stroke-width="0.75" marker-end="url(#arrow)"/>

<!-- 2. Backend / API layer -->
<rect x="40" y="104" width="600" height="140" rx="16" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.75"/>
<text x="60" y="129" font-size="14" font-weight="600" fill="#0c447c">Backend / API layer</text>

<rect x="160" y="156" width="170" height="56" rx="8" fill="#ffffff" stroke="#b4b2a9" stroke-width="0.75"/>
<text x="245" y="179" text-anchor="middle" font-size="14" font-weight="600" fill="#2c2c2a">Input validation</text>
<text x="245" y="197" text-anchor="middle" font-size="12" fill="#5f5e5a">Pydantic schemas</text>

<rect x="350" y="156" width="170" height="56" rx="8" fill="#ffffff" stroke="#b4b2a9" stroke-width="0.75"/>
<text x="435" y="179" text-anchor="middle" font-size="14" font-weight="600" fill="#2c2c2a">Submission store</text>
<text x="435" y="197" text-anchor="middle" font-size="12" fill="#5f5e5a">SQLite database</text>

<line x1="340" y1="244" x2="340" y2="274" stroke="#5f5e5a" stroke-width="0.75" marker-end="url(#arrow)"/>

<!-- 3. Reference knowledge base -->
<rect x="40" y="274" width="600" height="170" rx="16" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.75"/>
<text x="60" y="299" font-size="14" font-weight="600" fill="#085041">Reference knowledge base</text>

<rect x="60" y="320" width="170" height="70" rx="8" fill="#ffffff" stroke="#b4b2a9" stroke-width="0.75"/>
<text x="145" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#2c2c2a">Dataset ingestion</text>
<text x="145" y="363" text-anchor="middle" font-size="12" fill="#5f5e5a">TruthfulQA + SQuAD</text>

<rect x="250" y="320" width="170" height="70" rx="8" fill="#ffffff" stroke="#b4b2a9" stroke-width="0.75"/>
<text x="335" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#2c2c2a">Chunk + embed</text>
<text x="335" y="363" text-anchor="middle" font-size="12" fill="#5f5e5a">LangChain, MiniLM</text>

<rect x="440" y="320" width="170" height="70" rx="8" fill="#ffffff" stroke="#b4b2a9" stroke-width="0.75"/>
<text x="525" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#2c2c2a">Vector store</text>
<text x="525" y="363" text-anchor="middle" font-size="12" fill="#5f5e5a">ChromaDB</text>

<line x1="340" y1="444" x2="340" y2="474" stroke="#5f5e5a" stroke-width="0.75" marker-end="url(#arrow)"/>

<!-- 4. AI evaluation agent layer (planned - milestone 2) -->
<rect x="40" y="474" width="600" height="170" rx="16" fill="#eeedfe" stroke="#534ab7" stroke-width="0.75" stroke-dasharray="5 4"/>
<text x="60" y="499" font-size="14" font-weight="600" fill="#3c3489">AI evaluation agent layer</text>
<text x="60" y="516" font-size="12" fill="#534ab7">Designed now, built in milestone 2</text>

<rect x="60" y="536" width="170" height="56" rx="8" fill="#ffffff" stroke="#b4b2a9" stroke-width="0.75"/>
<text x="145" y="559" text-anchor="middle" font-size="14" font-weight="600" fill="#2c2c2a">Orchestrator</text>
<text x="145" y="577" text-anchor="middle" font-size="12" fill="#5f5e5a">Coordinates agents</text>

<rect x="250" y="536" width="170" height="56" rx="8" fill="#ffffff" stroke="#b4b2a9" stroke-width="0.75"/>
<text x="335" y="559" text-anchor="middle" font-size="14" font-weight="600" fill="#2c2c2a">Judge agents</text>
<text x="335" y="577" text-anchor="middle" font-size="12" fill="#5f5e5a">4 dimensions</text>

<rect x="440" y="536" width="170" height="56" rx="8" fill="#ffffff" stroke="#b4b2a9" stroke-width="0.75"/>
<text x="525" y="559" text-anchor="middle" font-size="14" font-weight="600" fill="#2c2c2a">Verdict agent</text>
<text x="525" y="577" text-anchor="middle" font-size="12" fill="#5f5e5a">Aggregates scores</text>

<line x1="340" y1="644" x2="340" y2="674" stroke="#5f5e5a" stroke-width="0.75" marker-end="url(#arrow)"/>

<!-- 5. Results -->
<rect x="210" y="674" width="260" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.75"/>
<text x="340" y="697" text-anchor="middle" font-size="14" font-weight="600" fill="#2c2c2a">Structured results</text>
<text x="340" y="715" text-anchor="middle" font-size="12" fill="#5f5e5a">JSON output</text>
</svg>
